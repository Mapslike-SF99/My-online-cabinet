<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>나의 온라인 캐비넷</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5622b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&family=Gowun+Batang&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2e9;
    --ink:#2b2620;
    --ink-soft:#6b6154;
    --line:#d8cfbd;
    --spine-cd:#8a5a3b;
    --spine-tape:#4a5d52;
    --spine-book:#5b4b73;
    --accent:#b5622b;
    --card:#fffdf8;
    --danger:#a13a2c;
    --app-font: "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: var(--app-font);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 80px;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:8px;
  }
  header.top h1{
    font-size:28px;
    margin:0;
    letter-spacing:0.5px;
    font-weight:600;
  }
  header.top .count{
    font-size:14px;
    color:var(--ink-soft);
  }
  .btn-export{
    border:1px solid var(--ink-soft);
    background:var(--card);
    color:var(--ink);
    padding:7px 14px;
    border-radius:3px;
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
  }
  .btn-export:hover{border-color:var(--accent);color:var(--accent);}
  .btn-export.btn-orange{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-export.btn-orange:hover{opacity:0.9;color:#fff;}
  .btn-export.btn-green{background:#3f8a5c;border-color:#3f8a5c;color:#fff;}
  .btn-export.btn-green:hover{opacity:0.9;color:#fff;}
  .btn-export.btn-blue{background:#3a6ea5;border-color:#3a6ea5;color:#fff;}
  .btn-export.btn-blue:hover{opacity:0.9;color:#fff;}
  .edit-name-btn{
    border:none;
    background:transparent;
    cursor:pointer;
    font-size:16px;
    opacity:0.55;
    padding:2px 4px;
  }
  .edit-name-btn:hover{opacity:1;}

  .display-settings{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .display-settings label{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .display-settings select{
    font-family:inherit;
    font-size:13px;
    padding:5px 7px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card);
    color:var(--ink);
  }
  .display-settings input[type="color"]{
    width:30px;
    height:26px;
    border:1px solid var(--line);
    border-radius:3px;
    padding:1px;
    background:var(--card);
    cursor:pointer;
  }
  .display-settings .reset-btn{
    border:1px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    padding:4px 9px;
    border-radius:3px;
    font-family:inherit;
    font-size:12.5px;
    cursor:pointer;
  }
  .display-settings .reset-btn:hover{color:var(--accent);border-color:var(--accent);}

  nav.shelves{
    display:flex;
    gap:10px;
    margin-bottom:24px;
  }
  nav.shelves button{
    flex:1;
    padding:12px 10px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    border-radius:3px;
    transition:all .15s ease;
    position:relative;
  }
  nav.shelves button.active{
    color:var(--paper);
    border-color:transparent;
  }
  nav.shelves button[data-k="cd"].active{background:var(--spine-cd);}
  nav.shelves button[data-k="tape"].active{background:var(--spine-tape);}
  nav.shelves button[data-k="book"].active{background:var(--spine-book);}
  nav.shelves button[data-k="image"].active{background:#3a6ea5;color:#fff;}
  nav.shelves button.custom-tab.active{background:var(--accent);color:#fff;}

  .add-tab-btn{
    flex:0 0 auto;
    border:1px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
  }
  .add-tab-btn:hover{color:var(--accent);border-color:var(--accent);}
  .custom-tab .tab-close{
    margin-left:6px;
    opacity:0.7;
    font-weight:700;
  }
  .custom-tab .tab-close:hover{opacity:1;}

  .panel{display:none;}
  .panel.active{display:block;}

  form.add-form{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:18px;
    margin-bottom:22px;
  }
  form.add-form .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  form.add-form .grid.wide{grid-template-columns:1fr;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--ink-soft);}
  .field input, .field select, .field textarea{
    font-family:inherit;
    font-size:15px;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:38px;}

  .set-row{
    display:flex;
    align-items:center;
    gap:10px;
    grid-column:1/-1;
    background:#f1ead9;
    border:1px dashed var(--line);
    padding:10px 12px;
    border-radius:3px;
  }
  .set-row .stepper{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .set-row button{
    width:28px;height:28px;
    border:1px solid var(--ink-soft);
    background:#fff;
    border-radius:3px;
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  .set-row .num{
    min-width:26px;
    text-align:center;
    font-weight:600;
  }
  .set-row .hint{font-size:12px;color:var(--ink-soft);}

  .add-actions{
    margin-top:14px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }
  .img-rec-upload-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  #imgRecPreview{
    max-width:220px;
    max-height:220px;
    border:1px solid var(--line);
    border-radius:4px;
    display:block;
  }
  .img-rec-count{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .img-rec-full-msg{
    background:#fdf1e0;
    border:1px solid #e8c99a;
    color:#7a5220;
    padding:8px 12px;
    border-radius:4px;
    font-size:13px;
  }
  .btn-primary{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:9px 20px;
    border-radius:3px;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
  }
  .btn-primary:hover{opacity:0.92;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .item{
    background:var(--card);
    border:1px solid var(--line);
    border-left:6px solid var(--spine-cd);
    border-radius:3px;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .panel[data-k="tape"] .item{border-left-color:var(--spine-tape);}
  .panel[data-k="book"] .item{border-left-color:var(--spine-book);}

  .item .main{flex:1;}
  .item .title{font-size:17px;font-weight:600;}
  .item .sub{font-size:13.5px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
  .item .sub.artist-line{margin-top:0;margin-bottom:2px;}
  .media-comp{font-weight:600;color:var(--ink);}
  .item .title.clickable{cursor:pointer;}
  .item .title.clickable:hover{color:var(--accent);}
  .track-hint{
    font-size:12px;
    font-weight:400;
    color:var(--accent);
    margin-left:8px;
    text-decoration:underline;
    white-space:nowrap;
  }
  .track-hint::after{content:' ▾';}
  .title.expanded .track-hint::after{content:' ▴';}
  .badge{
    display:inline-block;
    font-size:12px;
    background:#efe4cf;
    border:1px solid var(--line);
    padding:1px 7px;
    border-radius:10px;
    margin-left:6px;
    color:var(--ink);
  }
  .item .actions{display:flex;gap:6px;flex-shrink:0;}
  .item .actions button{
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    padding:5px 10px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .item .actions button.del{color:var(--danger);border-color:#e2c3ba;}
  .item .actions button.edit:hover{color:var(--accent);border-color:var(--accent);}
  .edit-fields{display:flex;flex-direction:column;gap:12px;}
  .edit-fields .field textarea{min-height:110px;}
  .edit-fields .field-check{flex-direction:row;align-items:center;gap:8px;}
  .edit-fields .field-check label{font-size:14px;color:var(--ink);}
  .edit-fields .field-check input{width:16px;height:16px;}
  .edit-fields .edit-help{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:-4px;}
  .edit-fields .edit-thumb{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line);}
  .edit-error{color:var(--danger);font-size:13px;margin-top:10px;}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:40px 10px;
    font-size:15px;
    border:1px dashed var(--line);
    border-radius:4px;
  }

  .status{font-size:13px;color:var(--ink-soft);margin-top:4px;min-height:16px;}

  .sort-bar{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin:0 0 10px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .sort-bar label{display:flex;align-items:center;gap:6px;}
  .sort-bar select{
    font-family:inherit;
    font-size:13px;
    padding:5px 7px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--card);
    color:var(--ink);
  }
  .bulk-tools{display:flex;gap:8px;}
  .row-pick{display:flex;align-items:flex-start;padding-top:2px;cursor:pointer;flex-shrink:0;}
  .row-pick input{width:18px;height:18px;margin:0;cursor:pointer;}
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:16px;
  }
  .modal-box{
    background:var(--card);
    color:var(--ink);
    border-radius:6px;
    width:100%;
    max-width:440px;
    max-height:90vh;
    overflow:auto;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
  }
  .modal-title{font-size:17px;font-weight:700;margin-bottom:10px;}
  .modal-body{font-size:14px;line-height:1.6;}
  .modal-body p{margin:0 0 8px;}
  .modal-body ul{margin:0 0 10px;padding-left:20px;}
  .modal-body .modal-help{font-size:12.5px;color:var(--ink-soft);}
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .app-footer{
    text-align:center;
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .app-footer a{
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:none;
  }
  .app-footer a:hover{color:var(--accent);text-decoration:underline;}
  .app-footer-ver{font-size:11px;color:var(--ink-soft);opacity:0.6;margin-top:2px;}
  .app-footer-sub{
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.75;
    margin-top:4px;
  }

  .search-bar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 12px;
  }
  .search-bar input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    padding:4px 0;
  }
  .search-bar .icon{color:var(--ink-soft);font-size:15px;}
  .search-bar .clear{
    border:1px solid var(--line);
    background:#fff;
    border-radius:3px;
    padding:4px 9px;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    display:none;
  }
  .search-bar.has-query .clear{display:inline-block;}

  .search-results{display:none;flex-direction:column;gap:10px;}
  .search-results.active{display:flex;}
  .search-results .type-tag{
    font-size:11px;
    padding:1px 8px;
    border-radius:10px;
    margin-right:8px;
    color:#fff;
  }
  .search-results .item[data-kind="cd"]{border-left-color:var(--spine-cd);}
  .search-results .item[data-kind="tape"]{border-left-color:var(--spine-tape);}
  .search-results .item[data-kind="book"]{border-left-color:var(--spine-book);}
  .type-tag.cd{background:var(--spine-cd);}
  .type-tag.tape{background:var(--spine-tape);}
  .type-tag.book{background:var(--spine-book);}
  .search-summary{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}

  .tracks-toggle{
    background:none;
    border:none;
    color:var(--accent);
    font-size:12.5px;
    cursor:pointer;
    padding:0;
    margin-top:5px;
    text-decoration:underline;
  }
  .tracks-list{
    display:none;
    margin-top:8px;
    padding:8px 10px;
    background:#f1ead9;
    border-radius:3px;
    font-size:13.5px;
    line-height:1.7;
  }
  .tracks-list.open{display:block;}
  .tracks-list ol{margin:0;padding-left:20px;}
  .tracks-list .disc-title{font-weight:700;font-size:13px;margin:10px 0 2px;}
  .tracks-list .disc-title:first-child{margin-top:0;}
  .track-tools{display:flex;gap:8px;margin:0 0 8px;}
  .tt-btn{border:1px solid var(--line);background:#fff;border-radius:3px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
  .tt-btn:hover{color:var(--accent);border-color:var(--accent);}
  .tt-btn.tt-danger{color:var(--danger);border-color:#e2c3ba;}
  .trk{display:inline-flex;align-items:baseline;gap:6px;cursor:pointer;}
  .trk input{margin:0;}
  .tape-list{list-style:none;margin:0;padding:0;}
  .tape-list li{margin:3px 0;}
  .trk-no{font-weight:600;color:var(--ink-soft);white-space:nowrap;}

  .track-builder{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .track-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .track-row .track-num{
    width:24px;
    text-align:right;
    font-size:13px;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .track-row input{
    flex:1;
    font-family:inherit;
    font-size:14.5px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  .track-row .track-remove{
    border:1px solid var(--line);
    background:#fff;
    color:var(--danger);
    width:26px;height:26px;
    border-radius:3px;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .add-track{
    align-self:flex-start;
    margin-top:8px;
    border:1px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    padding:6px 12px;
    border-radius:3px;
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
  }
  .add-track:hover{color:var(--accent);border-color:var(--accent);}

  .track-group{
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    background:#faf6ec;
  }
  .track-group + .track-group{margin-top:10px;}
  .track-group-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
    letter-spacing:0.3px;
  }
  .track-subgroup{margin-top:4px;}
  .track-subgroup + .track-subgroup{margin-top:12px;}
  .track-side-title{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .add-track-sub{
    align-self:flex-start;
    margin-top:6px;
    border:1px dashed var(--ink-soft);
    background:transparent;
    color:var(--ink-soft);
    padding:4px 10px;
    border-radius:3px;
    font-family:inherit;
    font-size:12.5px;
    cursor:pointer;
    display:inline-block;
  }
  .add-track-sub:hover{color:var(--accent);border-color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:flex;align-items:center;gap:8px;">
      <h1 id="mainTitle">나의 온라인 캐비넷</h1>
      <button class="edit-name-btn" id="editNameBtn" title="내 이름 설정">✏️</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="count" id="totalCount"></div>
      <button class="btn-export btn-orange" id="templateBtn">저장용 엑셀폼 받기</button>
      <button class="btn-export btn-green" id="uploadBtn">엑셀 업로드</button>
      <input type="file" id="uploadInput" accept=".xlsx,.xls" style="display:none;">
      <button class="btn-export btn-blue" id="exportBtn">엑셀로 내보내기</button>
    </div>
  </header>

  <div class="display-settings">
    <label>글씨체
      <select id="fontSelect">
        <option value="default">기본 고딕</option>
        <option value="noto-sans">노토 산스</option>
        <option value="noto-serif">노토 세리프</option>
        <option value="nanum-gothic">나눔고딕</option>
        <option value="nanum-myeongjo">나눔명조</option>
        <option value="gowun-dodum">고운돋움</option>
        <option value="gowun-batang">고운바탕</option>
        <option value="black-han-sans">블랙한산스 (임팩트)</option>
        <option value="do-hyeon">도현 (굵은고딕)</option>
        <option value="jua">주아 (동글동글)</option>
        <option value="gaegu">개구 (손글씨체)</option>
        <option value="ibm-plex">IBM 플렉스 산스</option>
        <option value="song-myung">송명 (붓글씨느낌)</option>
      </select>
    </label>
    <label>배경색
      <input type="color" id="bgColorInput" value="#f6f2e9">
    </label>
    <button class="reset-btn" id="resetDisplayBtn">기본값으로</button>
  </div>

  <div class="search-bar" id="searchBar">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="제목, 아티스트/저자, 트랙명, 구매처 등으로 CD·테이프·도서 통합 검색">
    <button class="clear" id="searchClear">지우기</button>
  </div>

  <nav class="shelves" id="shelvesNav">
    <button data-k="cd" class="active">CD's</button>
    <button data-k="tape">Tape's</button>
    <button data-k="book">Book's</button>
    <button data-k="image">이미지로 기록하기</button>
    <span id="customTabsContainer" style="display:contents;"></span>
    <button id="addTabBtn" class="add-tab-btn" title="새 탭 추가">+ 탭 추가</button>
  </nav>

  <div class="search-results" id="searchResults">
    <div class="search-summary" id="searchSummary"></div>

<script>
const KIND_KEYS = { cd:'items:cd', tape:'items:tape', book:'items:book' };
const OWNER_KEY = 'settings:ownerName';
const CUSTOM_TABS_KEY = 'settings:customTabs';
let data = { cd:[], tape:[], book:[] };
let setVal = { cd:1, tape:1 };
let ownerName = '';
let customTabs = []; // [{id, name}]
let sortPrefs = {};  // 탭별 정렬 방식 { cd:'title', ... }
const SORT_KEY = 'settings:sortPrefs';

// Claude 아티팩트 안에서 열람 중이면 window.storage(클라우드 저장)를 쓰고,
// 다운로드한 파일을 브라우저에서 직접 열었을 때는 window.storage가 없으므로
// 이 브라우저의 localStorage로 자동 대체해서 새로고침/재실행해도 데이터가 남도록 한다.
const LOCAL_PREFIX = 'gunslib:';
async function storageGet(key, shared){
  if(window.storage){
    try{ return await window.storage.get(key, shared); }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem(LOCAL_PREFIX+key);
    return raw !== null ? { key, value: raw, shared } : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(window.storage){
    try{ return await window.storage.set(key, value, shared); }catch(e){ return null; }
  }
  try{
    localStorage.setItem(LOCAL_PREFIX+key, value);
    return { key, value, shared };
  }catch(e){ return null; }
}
async function storageDelete(key, shared){
  if(window.storage){
    try{ return await window.storage.delete(key, shared); }catch(e){ return null; }
  }
  try{
    localStorage.removeItem(LOCAL_PREFIX+key);
    return { key, deleted:true, shared };
  }catch(e){ return null; }
}

function statusMsg(t){
  const el = document.getElementById('status');
  el.textContent = t;
  if(t) setTimeout(()=>{ if(el.textContent===t) el.textContent=''; }, 2500);
}

function applyTitle(){
  const titleEl = document.getElementById('mainTitle');
  const display = ownerName ? `${ownerName}의 온라인 캐비넷` : '나의 온라인 캐비넷';
  titleEl.textContent = display;
  document.title = display;
}

async function loadOwnerName(){
  try{
    const res = await storageGet(OWNER_KEY, false);
    ownerName = res && res.value ? res.value : '';
  }catch(e){
    ownerName = '';
  }
  applyTitle();
}

async function saveOwnerName(name){
  ownerName = name.trim();
  applyTitle();
  try{
    if(ownerName){
      await storageSet(OWNER_KEY, ownerName, false);
    }else{
      try{ await storageDelete(OWNER_KEY, false); }catch(e){ /* 이미 없음 */ }
    }
  }catch(e){
    statusMsg('이름 저장 중 오류가 발생했습니다.');
  }
}

document.getElementById('editNameBtn').addEventListener('click', ()=>{
  const input = window.prompt('보관함에 표시할 이름을 입력해주세요. (비워두면 "나의 온라인 캐비넷"으로 표시됩니다)', ownerName);
  if(input === null) return;
  saveOwnerName(input);
});

// ---- 글씨체 / 배경색 설정 (모두 무료 오픈소스 라이선스 폰트) ----
const FONT_KEY = 'settings:fontFamily';
const BG_KEY = 'settings:bgColor';
const DEFAULT_BG = '#f6f2e9';
const FONT_MAP = {
  'default': '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif',
  'noto-sans': '"Noto Sans KR", sans-serif',
  'noto-serif': '"Noto Serif KR", serif',
  'nanum-gothic': '"Nanum Gothic", sans-serif',
  'nanum-myeongjo': '"Nanum Myeongjo", serif',
  'gowun-dodum': '"Gowun Dodum", sans-serif',
  'gowun-batang': '"Gowun Batang", serif',
  'black-han-sans': '"Black Han Sans", sans-serif',
  'do-hyeon': '"Do Hyeon", sans-serif',
  'jua': '"Jua", sans-serif',
  'gaegu': '"Gaegu", cursive',
  'ibm-plex': '"IBM Plex Sans KR", sans-serif',
  'song-myung': '"Song Myung", serif'
};

function applyFont(key){
  document.documentElement.style.setProperty('--app-font', FONT_MAP[key] || FONT_MAP.default);
}
function applyBg(hex){
  document.documentElement.style.setProperty('--paper', hex || DEFAULT_BG);
}

async function loadDisplaySettings(){
  const [fontRes, bgRes] = await Promise.all([
    storageGet(FONT_KEY, false),
    storageGet(BG_KEY, false)
  ]);
  const fontKey = (fontRes && fontRes.value) ? fontRes.value : 'default';
  const bgHex = (bgRes && bgRes.value) ? bgRes.value : DEFAULT_BG;
  document.getElementById('fontSelect').value = fontKey;
  document.getElementById('bgColorInput').value = bgHex;
  applyFont(fontKey);
  applyBg(bgHex);
}

document.getElementById('fontSelect').addEventListener('change', async (e)=>{
  const key = e.target.value;
  applyFont(key);
  await storageSet(FONT_KEY, key, false);
});

document.getElementById('bgColorInput').addEventListener('input', async (e)=>{
  const hex = e.target.value;
  applyBg(hex);
  await storageSet(BG_KEY, hex, false);
});

document.getElementById('resetDisplayBtn').addEventListener('click', async ()=>{
  document.getElementById('fontSelect').value = 'default';
  document.getElementById('bgColorInput').value = DEFAULT_BG;
  applyFont('default');
  applyBg(DEFAULT_BG);
  await storageSet(FONT_KEY, 'default', false);
  await storageSet(BG_KEY, DEFAULT_BG, false);
  statusMsg('기본 글씨체/배경색으로 되돌렸습니다.');
});

function storageKeyFor(k){
  if(KIND_KEYS[k]) return KIND_KEYS[k];
  return 'items:custom:' + k;
}

async function loadAll(){
  for(const k of Object.keys(KIND_KEYS)){
    try{
      const res = await storageGet(KIND_KEYS[k], false);
      data[k] = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      data[k] = [];
    }
  }
  await loadCustomTabs();
  await loadSortPrefs();
  renderAll();
}

async function loadCustomTabs(){
  try{
    const res = await storageGet(CUSTOM_TABS_KEY, false);
    customTabs = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    customTabs = [];
  }
  for(const tab of customTabs){
    buildCustomTabDom(tab, false);
    try{
      const res = await storageGet(storageKeyFor(tab.id), false);
      data[tab.id] = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      data[tab.id] = [];
    }
  }
}

async function saveCustomTabsList(){
  try{
    await storageSet(CUSTOM_TABS_KEY, JSON.stringify(customTabs), false);
  }catch(e){
    statusMsg('탭 목록 저장 중 오류가 발생했습니다.');
  }
}

async function save(k){
  try{
    await storageSet(storageKeyFor(k), JSON.stringify(data[k]), false);
  }catch(e){
    statusMsg('저장 중 오류가 발생했습니다.');
  }
}

function renderAll(){
  renderList('cd');
  renderList('tape');
  renderList('book');
  customTabs.forEach(tab => renderList(tab.id));
  updateTotal();
  refreshImgRecUI();
}

function updateTotal(){
  const parts = [
    `CD's ${data.cd.length}`,
    `Tape's ${data.tape.length}`,
    `Book's ${data.book.length}`
  ];
  let total = data.cd.length + data.tape.length + data.book.length;
  customTabs.forEach(tab=>{
    const n = (data[tab.id]||[]).length;
    parts.push(`${tab.name} ${n}`);
    total += n;
  });
  document.getElementById('totalCount').textContent = `${parts.join(' · ')} (총 ${total}개)`;
}

function esc(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function trackTools(k, id){
  return `<div class="track-tools">
      <button type="button" class="tt-btn tt-sel" onclick="deleteSelectedTracks('${k}','${id}',this)">선택삭제</button>
      <button type="button" class="tt-btn tt-danger" onclick="deleteAllTracks('${k}','${id}')">전체삭제</button>
    </div>`;
}

function tracksBlock(item, k){
  const tracks = item.tracks || [];
  if(!tracks.length) return '';
  const tools = trackTools(k, item.id);
  const li = (name, i)=> `<li><label class="trk"><input type="checkbox" data-ti="${i}"><span>${esc(name)}</span></label></li>`;
  const dn = (item.discNotes && Object.keys(item.discNotes).length) ? item.discNotes : null;
  if(k === 'cd'){
    const parsed = tracks.map((t, i)=>{
      const m = String(t).match(/^Disc\s+(\d+):\s*(.*)$/i);
      return { d: m ? parseInt(m[1], 10) : 1, name: m ? m[2] : String(t), i, pre: !!m };
    });
    const maxD = Math.max(...parsed.map(x => x.d));
    // 2장 이상이면 디스크별로 나눠서, 디스크마다 1번부터 번호를 매김
    if(parsed.some(x => x.pre) && (maxD > 1 || (item.setCount || 1) > 1 || dn)){
      const byDisc = new Map();
      parsed.forEach(x=>{ if(!byDisc.has(x.d)) byDisc.set(x.d, []); byDisc.get(x.d).push(x); });
      const html = [...byDisc.keys()].sort((x, y)=> x - y).map(d =>
        `<div class="disc-title">Disc ${d}${dn && dn[d] ? ' · ' + esc(dn[d]) : ''}</div><ol>${byDisc.get(d).map(x => li(x.name, x.i)).join('')}</ol>`
      ).join('');
      return `<div class="tracks-list">${tools}${html}</div>`;
    }
  }
  if(k === 'tape'){
    // 테이프: 체크박스 + "A면-1 곡명" (면마다 1번부터)
    const counts = {};
    const lis = tracks.map((t, i)=>{
      const m = String(t).match(/^(?:Tape\s+(\d+)\s+)?([AB])면:\s*(.*)$/i);
      if(!m) return `<li><label class="trk"><input type="checkbox" data-ti="${i}"><span>${esc(t)}</span></label></li>`;
      const tapeNo = m[1] || '';
      const side = m[2].toUpperCase();
      const key = tapeNo + '|' + side;
      counts[key] = (counts[key] || 0) + 1;
      const label = (tapeNo ? 'Tape' + tapeNo + ' ' : '') + side + '면-' + counts[key];
      return `<li><label class="trk"><input type="checkbox" data-ti="${i}"><span class="trk-no">${label}</span> <span>${esc(m[3])}</span></label></li>`;
    });
    return `<div class="tracks-list">${tools}<ul class="tape-list">${lis.join('')}</ul></div>`;
  }
  return `<div class="tracks-list">${tools}<ol>${tracks.map((t, i)=> li(t, i)).join('')}</ol></div>`;
}

// 제목(.title)을 누르면 바로 아래의 트랙 목록을 펼치거나 접음
function toggleTracks(titleEl){
  const list = titleEl.nextElementSibling;
  if(list && list.classList.contains('tracks-list')){
    list.classList.toggle('open');
    titleEl.classList.toggle('expanded');
  }
}

// 트랙이 있으면 제목을 눌러 펼칠 수 있는 제목 줄, 없으면 일반 제목 줄
function mediaTitleHtml(item, badge){
  const n = (item.tracks || []).length;
  if(!n) return `<div class="title">${esc(item.title)}${badge}</div>`;
  return `<div class="title clickable" role="button" tabindex="0" title="눌러서 트랙 목록 보기"
      onclick="toggleTracks(this)"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTracks(this);}">${esc(item.title)}${badge}<span class="track-hint">트랙 ${n}곡</span></div>`;
}

function actionButtons(k, id){
  return `<button class="edit" onclick="openEditModal('${k}','${id}')">수정</button><button class="del" onclick="removeItem('${k}','${id}')">삭제</button>`;
}

function withThumb(item, innerHtml){
  if(!item.image) return innerHtml;
  return `<div style="display:flex;gap:12px;align-items:flex-start;">
    <img src="${item.image}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0;">
    <div style="flex:1;min-width:0;">${innerHtml}</div>
  </div>`;
}

// 디스크 메모에 DVD가 있으면 DVD, 그 외(CD 표기 또는 메모 없음)는 CD로 세어서 "3CD 1DVD" 형태로 만듦
function mediaComposition(item){
  const dn = item.discNotes || {};
  const keys = Object.keys(dn);
  if(keys.length){
    const total = Math.max(item.setCount || 1, ...keys.map(Number));
    let cd = 0, dvd = 0;
    for(let d = 1; d <= total; d++){ if(/dvd/i.test(dn[d] || '')) dvd++; else cd++; }
    return [cd ? cd + 'CD' : '', dvd ? dvd + 'DVD' : ''].filter(Boolean).join(' ');
  }
  if((item.setCount || 1) > 1) return (item.setCount) + 'CD';   // 디스크 메모가 없는 데이터는 전부 CD로 계산
  if((item.setCount || 1) === 1){
    const n = String(item.note || '');
    if(/dvd/i.test(n)) return '1DVD';
    if(/\bcd\b/i.test(n)) return '1CD';
  }
  return '';
}

function cdRowHtml(item, delAttr){
  const comp = mediaComposition(item);
  const inner = `<div class="sub artist-line">${esc(item.artist)||'아티스트 미상'}${comp ? ` · <span class="media-comp">${comp}</span>` : ''}${item.note?' · '+esc(item.note):''}</div>
      ${mediaTitleHtml(item, '')}
      ${tracksBlock(item,'cd')}`;
  return `<div class="item" data-kind="cd" data-id="${item.id}">
    <div class="main">
      ${withThumb(item, inner)}
    </div>
    <div class="actions">${actionButtons('cd', item.id)}</div>
  </div>`;
}
function tapeRowHtml(item){
  const inner = `<div class="sub artist-line">${esc(item.artist)||'아티스트 미상'}${item.note?' · '+esc(item.note):''}</div>
      ${mediaTitleHtml(item, item.setCount>1?`<span class="badge">${item.setCount}Tapes</span>`:'')}
      ${tracksBlock(item,'tape')}`;
  return `<div class="item" data-kind="tape" data-id="${item.id}">
    <div class="main">
      ${withThumb(item, inner)}
    </div>
    <div class="actions">${actionButtons('tape', item.id)}</div>
  </div>`;
}
function bookRowHtml(item){
  const meta = [
    item.publisher?('출판사: '+esc(item.publisher)):null,
    item.place?('구매처: '+esc(item.place)):null,
    item.purchaseDate?('구매일: '+esc(item.purchaseDate)):null
  ].filter(Boolean).join(' · ');
  const inner = `<div class="sub artist-line">${esc(item.author)||'저자 미상'}</div>
      <div class="title">${esc(item.title)}</div>
      <div class="sub">${meta || '추가 정보 없음'}${item.note?' · '+esc(item.note):''}</div>`;
  return `<div class="item" data-kind="book">
    <div class="main">
      ${withThumb(item, inner)}
    </div>
    <div class="actions">${actionButtons('book', item.id)}</div>
  </div>`;
}

function customRowHtml(item, tabId){
  const meta = [
    item.isGift ? '선물' : '구매',
    item.date ? esc(item.date) : null
  ].filter(Boolean).join(' · ');
  const inner = `<div class="title">${esc(item.title)}</div>
      <div class="sub">${meta}${item.note?' · '+esc(item.note):''}</div>`;
  return `<div class="item" data-kind="${esc(tabId)}" style="border-left-color:var(--accent);">
    <div class="main">
      ${withThumb(item, inner)}
    </div>
    <div class="actions">${actionButtons(tabId, item.id)}</div>
  </div>`;
}

function rowFnFor(k){
  if(k==='cd') return cdRowHtml;
  if(k==='tape') return tapeRowHtml;
  if(k==='book') return bookRowHtml;
  return (item)=> customRowHtml(item, k);
}

function kindLabelFor(k){
  if(k==='cd') return "CD's";
  if(k==='tape') return "Tape's";
  if(k==='book') return "Book's";
  const tab = customTabs.find(t=>t.id===k);
  return tab ? tab.name : k;
}

// ---- 정렬 (표시 순서만 바뀌고, 저장된 데이터 순서는 그대로) ----
async function loadSortPrefs(){
  try{
    const res = await storageGet(SORT_KEY, false);
    sortPrefs = res && res.value ? JSON.parse(res.value) : {};
  }catch(e){ sortPrefs = {}; }
}
async function saveSortPrefs(){
  try{ await storageSet(SORT_KEY, JSON.stringify(sortPrefs), false); }catch(e){ /* 무시 */ }
}

function sortOptionsFor(k){
  if(k === 'cd' || k === 'tape') return [['added','추가한 순서 (최근 먼저)'],['artist','아티스트순 (가나다·ABC)'],['title','제목순 (가나다·ABC)']];
  if(k === 'book') return [['added','추가한 순서 (최근 먼저)'],['author','저자순 (가나다·ABC)'],['title','제목순 (가나다·ABC)']];
  return [['added','추가한 순서 (최근 먼저)'],['title','이름순 (가나다·ABC)']];
}

function sortedItems(k){
  const items = (data[k] || []).slice();
  const mode = sortPrefs[k] || 'added';
  if(mode === 'added') return items;
  const cmp = (a, b)=> String(a || '').trim().localeCompare(String(b || '').trim(), 'ko', { numeric:true, sensitivity:'base' });
  const blank = v => !String(v || '').trim();
  const nameOf = it => mode === 'artist' ? it.artist : (mode === 'author' ? it.author : it.title);
  items.sort((x, y)=>{
    if(mode === 'title') return cmp(x.title, y.title) || cmp(x.artist || x.author, y.artist || y.author);
    const a = nameOf(x), b = nameOf(y);
    if(blank(a) !== blank(b)) return blank(a) ? 1 : -1;   // 이름이 비어 있는(미상) 항목은 맨 아래
    return cmp(a, b) || cmp(x.title, y.title);
  });
  return items;
}

function ensureSortBar(k, listEl){
  let bar = document.getElementById('sort-'+k);
  if(!bar){
    bar = document.createElement('div');
    bar.className = 'sort-bar';
    bar.id = 'sort-'+k;

    // 왼쪽: 체크한 항목 통째로 삭제 / 이 탭 전체 삭제
    const tools = document.createElement('div');
    tools.className = 'bulk-tools';
    tools.innerHTML = '<button type="button" class="tt-btn bulk-sel">선택삭제</button><button type="button" class="tt-btn tt-danger bulk-all">전체삭제</button>';
    tools.querySelector('.bulk-sel').addEventListener('click', ()=> deleteSelectedItems(k));
    tools.querySelector('.bulk-all').addEventListener('click', ()=> deleteAllItems(k));
    bar.appendChild(tools);

    // 오른쪽: 정렬
    const label = document.createElement('label');
    label.appendChild(document.createTextNode('정렬'));
    const sel = document.createElement('select');
    sortOptionsFor(k).forEach(([v, t])=>{
      const o = document.createElement('option');
      o.value = v; o.textContent = t;
      sel.appendChild(o);
    });
    sel.addEventListener('change', ()=>{
      sortPrefs[k] = sel.value;
      renderList(k);
      saveSortPrefs();
    });
    label.appendChild(sel);
    bar.appendChild(label);
    listEl.parentNode.insertBefore(bar, listEl);
  }
  bar.querySelector('select').value = sortPrefs[k] || 'added';
  const n = (data[k] || []).length;
  bar.style.display = n >= 1 ? 'flex' : 'none';                          // 항목이 있으면 삭제 버튼 표시
  bar.querySelector('label').style.display = n >= 2 ? 'flex' : 'none';   // 정렬은 2개 이상일 때만
}

function updateBulkLabel(k){
  const btn = document.querySelector(`#sort-${k} .bulk-sel`);
  if(!btn) return;
  const n = document.querySelectorAll(`#list-${k} .pick:checked`).length;
  btn.textContent = n ? `선택삭제 (${n})` : '선택삭제';
}

function renderList(k){
  const list = document.getElementById('list-'+k);
  if(!list) return;
  const prevChecked = new Set([...list.querySelectorAll('.pick:checked')].map(c => c.dataset.id));
  ensureSortBar(k, list);
  const items = sortedItems(k);
  if(!items.length){
    list.innerHTML = `<div class="empty">아직 등록된 항목이 없습니다. 위 양식으로 추가해보세요.</div>`;
    updateBulkLabel(k);
    return;
  }
  const fn = rowFnFor(k);
  list.innerHTML = items.map(item => fn(item)).join('');
  // 각 항목 왼쪽에 체크박스 (정렬·수정으로 다시 그려져도 체크 상태 유지)
  [...list.children].forEach((row, i)=>{
    if(!row.classList.contains('item') || !items[i]) return;
    const lab = document.createElement('label');
    lab.className = 'row-pick';
    lab.title = '선택';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'pick';
    cb.dataset.id = items[i].id;
    cb.dataset.k = k;
    cb.checked = prevChecked.has(items[i].id);
    lab.appendChild(cb);
    row.insertBefore(lab, row.firstChild);
  });
  updateBulkLabel(k);
}

async function deleteItemsByIds(k, ids){
  const drop = new Set(ids);
  data[k] = (data[k] || []).filter(x => !drop.has(x.id));
  await save(k);
  renderList(k);
  updateTotal();
  refreshImgRecUI();
  const q = document.getElementById('searchInput').value;
  if(q.trim()) runSearch(q);
  statusMsg(`${drop.size}개를 삭제했어요.`);
}

async function deleteSelectedItems(k){
  const ids = [...document.querySelectorAll(`#list-${k} .pick:checked`)].map(c => c.dataset.id);
  if(!ids.length){ statusMsg('삭제할 항목을 먼저 체크해주세요.'); return; }
  if(await askConfirm(`선택된 ${ids.length}개를 삭제하시겠습니까?`)) await deleteItemsByIds(k, ids);
}

async function deleteAllItems(k){
  const n = (data[k] || []).length;
  if(!n) return;
  if(await askConfirm(`${kindLabelFor(k)} 전체 ${n}개를 삭제하시겠습니까?`)) await deleteItemsByIds(k, data[k].map(x => x.id));
}

document.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.matches && cb.matches('input.pick')) updateBulkLabel(cb.dataset.k);
});

// ---- 통합 검색 ----
function matches(item, k, q){
  const fields = [item.title, item.artist, item.author, item.publisher, item.place, item.note, item.purchaseDate, item.date];
  if(item.tracks && item.tracks.length) fields.push(item.tracks.join(' '));
  if(item.discNotes) fields.push(Object.values(item.discNotes).join(' '));
  return fields.some(f => (f||'').toLowerCase().includes(q));
}

function allTabKeys(){
  return ['cd','tape','book', ...customTabs.map(t=>t.id)];
}

function runSearch(q){
  const query = q.trim().toLowerCase();
  const bar = document.getElementById('searchBar');
  const nav = document.getElementById('shelvesNav');
  const panels = document.querySelectorAll('.panel');
  const resultsWrap = document.getElementById('searchResults');

  if(!query){
    bar.classList.remove('has-query');
    nav.style.display = '';
    panels.forEach(p=>{ if(p.dataset.k === currentTab) p.classList.add('active'); });
    resultsWrap.classList.remove('active');
    return;
  }

  bar.classList.add('has-query');
  nav.style.display = 'none';
  panels.forEach(p=>p.classList.remove('active'));
  resultsWrap.classList.add('active');

  let html = '';
  let total = 0;
  allTabKeys().forEach(k=>{
    (data[k]||[]).filter(item => matches(item, k, query)).forEach(item=>{
      total++;
      const row = rowFnFor(k)(item);
      const isBuiltIn = (k==='cd'||k==='tape'||k==='book');
      const tagHtml = isBuiltIn
        ? `<span class="type-tag ${k}">${esc(kindLabelFor(k))}</span>`
        : `<span class="type-tag" style="background:var(--accent);">${esc(kindLabelFor(k))}</span>`;
      html += row.replace(/<div class="title([^"]*)"([^>]*)>/, (m, cls, attrs)=> `<div class="title${cls}"${attrs}>${tagHtml}`);
    });
  });

  document.getElementById('searchSummary').textContent = `"${q.trim()}" 검색 결과 ${total}건`;
  document.getElementById('searchList').innerHTML = total
    ? html
    : `<div class="empty">일치하는 항목이 없습니다.</div>`;
}

function removeItem(k, id){
  data[k] = data[k].filter(x => x.id !== id);
  renderList(k);
  updateTotal();
  save(k);
  if(k === 'image') refreshImgRecUI();
  const q = document.getElementById('searchInput').value;
  if(q.trim()) runSearch(q);
  statusMsg('삭제되었습니다.');
}

// ---- 탭 전환 ----
let currentTab = 'cd';
function activateTab(k){
  currentTab = k;
  document.querySelectorAll('button[data-k]').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const btn = document.querySelector(`button[data-k="${k}"]`);
  if(btn) btn.classList.add('active');
  const panel = document.querySelector(`.panel[data-k="${k}"]`);
  if(panel) panel.classList.add('active');

  // 검색 중이었다면 검색 상태를 해제하고 탭 화면으로 복귀
  const searchInputEl = document.getElementById('searchInput');
  if(searchInputEl && searchInputEl.value){
    searchInputEl.value = '';
  }
  document.getElementById('searchBar').classList.remove('has-query');
  document.getElementById('shelvesNav').style.display = '';
  document.getElementById('searchResults').classList.remove('active');
}

document.querySelectorAll('button[data-k]').forEach(btn=>{
  btn.addEventListener('click', ()=> activateTab(btn.dataset.k));
});

// search
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', ()=> runSearch(searchInput.value));
document.getElementById('searchClear').addEventListener('click', ()=>{

// ---- 사용자 정의 탭 (물품명 / 구매·선물 / 날짜 / 메모) ----
function slugify(name){
  return 'tab_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
}

function buildCustomTabDom(tab, activate){
  // 탭 버튼
  const btn = document.createElement('button');
  btn.className = 'custom-tab';
  btn.dataset.k = tab.id;
  btn.innerHTML = `${esc(tab.name)}<span class="tab-close" title="탭 삭제">×</span>`;
  btn.addEventListener('click', (e)=>{
    if(e.target.classList.contains('tab-close')){
      e.stopPropagation();
      removeCustomTab(tab.id);
      return;
    }
    activateTab(tab.id);
  });
  document.getElementById('customTabsContainer').appendChild(btn);

  // 패널 (폼 + 목록)
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.dataset.k = tab.id;
  panel.innerHTML = `
    <form class="add-form" id="form-${tab.id}">
      <div class="grid">
        <div class="field"><label>물품명</label><input required name="title" placeholder="예: 무선 이어폰"></div>
        <div class="field"><label>날짜</label><input type="date" name="date"></div>
      </div>
      <div class="grid wide" style="margin-top:12px;">
        <div class="field" style="flex-direction:row;align-items:center;gap:8px;">
          <input type="checkbox" name="isGift" id="isGift-${tab.id}" style="width:16px;height:16px;">
          <label for="isGift-${tab.id}" style="font-size:14px;color:var(--ink);">선물로 받음 (체크 안 하면 구매로 기록)</label>
        </div>
        <div class="field"><label>메모</label><textarea name="note" placeholder="상태, 특이사항 등"></textarea></div>
      </div>
      <div class="add-actions"><button type="submit" class="btn-primary">추가</button></div>
    </form>
    <div class="list" id="list-${tab.id}"></div>
  `;
  document.querySelector('.wrap').insertBefore(panel, document.getElementById('status'));

  panel.querySelector('form').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = e.target;
    const item = {
      id: 'item_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      title: f.title.value.trim(),
      isGift: f.isGift.checked,
      date: f.date.value,
      note: f.note.value.trim()
    };
    if(!item.title) return;
    if(!data[tab.id]) data[tab.id] = [];
    data[tab.id].unshift(item);
    f.reset();
    renderList(tab.id); updateTotal();
    await save(tab.id);
    statusMsg('추가되었습니다.');
  });

  if(!data[tab.id]) data[tab.id] = [];
  if(activate) activateTab(tab.id);
}

async function removeCustomTab(id){
  const tab = customTabs.find(t=>t.id===id);
  if(!tab) return;
  if(!window.confirm(`"${tab.name}" 탭을 삭제할까요? 안에 담긴 항목도 함께 사라집니다.`)) return;

  customTabs = customTabs.filter(t=>t.id!==id);
  delete data[id];
  await saveCustomTabsList();
  try{ await storageDelete(storageKeyFor(id), false); }catch(e){ /* 무시 */ }

  const btn = document.querySelector(`nav.shelves button[data-k="${id}"]`);
  if(btn) btn.remove();
  const panel = document.querySelector(`.panel[data-k="${id}"]`);
  if(panel) panel.remove();

  if(currentTab === id) activateTab('cd');
  updateTotal();
  statusMsg('탭을 삭제했습니다.');
}

document.getElementById('addTabBtn').addEventListener('click', async ()=>{
  const name = window.prompt('추가할 탭 이름을 입력해주세요 (예: 피규어, 굿즈, 시계 등)');
  if(!name || !name.trim()) return;
  const tab = { id: slugify(name), name: name.trim() };
  customTabs.push(tab);
  buildCustomTabDom(tab, true);
  await saveCustomTabsList();
  updateTotal();
  statusMsg(`"${tab.name}" 탭이 추가되었습니다.`);
});

// ---- 트랙 빌더: CD는 Disc별, Tape는 Tape×A/B면별로 그룹 관리 ----
const trackState = {
  cd: { discs: [ [''] ] },
  tape: { tapes: [ { a:[''], b:[''] } ] }
};

function trackRowHtml(val, i, attrs){
  const attrStr = Object.entries(attrs).map(([k,v])=>`data-${k}="${v}"`).join(' ');
  return `<div class="track-row">
    <span class="track-num">${i+1}.</span>
    <input type="text" value="${esc(val)}" placeholder="곡명 입력" data-idx="${i}" ${attrStr}>
    <button type="button" class="track-remove" data-idx="${i}" ${attrStr} title="삭제">×</button>
  </div>`;
}

function renderCdTracks(){
  const wrap = document.getElementById('tracks-cd');
  const discs = trackState.cd.discs;
  wrap.innerHTML = discs.map((discTracks, dIdx) => `
    <div class="track-group">
      <div class="track-group-title">Disc ${dIdx+1}</div>
      ${discTracks.map((val,i)=>trackRowHtml(val, i, {disc:dIdx})).join('')}
      <button type="button" class="add-track-sub" data-disc="${dIdx}">+ Disc ${dIdx+1} 트랙 추가</button>
    </div>
  `).join('');
}

function renderTapeTracks(){
  const wrap = document.getElementById('tracks-tape');
  const tapes = trackState.tape.tapes;
  wrap.innerHTML = tapes.map((t, tIdx) => `
    <div class="track-group">
      ${tapes.length>1 ? `<div class="track-group-title">Tape ${tIdx+1}</div>` : ''}
      <div class="track-subgroup">
        <div class="track-side-title">A면</div>
        ${t.a.map((val,i)=>trackRowHtml(val, i, {tape:tIdx, side:'a'})).join('')}
        <button type="button" class="add-track-sub" data-tape="${tIdx}" data-side="a">+ A면 트랙 추가</button>
      </div>
      <div class="track-subgroup">
        <div class="track-side-title">B면</div>
        ${t.b.map((val,i)=>trackRowHtml(val, i, {tape:tIdx, side:'b'})).join('')}
        <button type="button" class="add-track-sub" data-tape="${tIdx}" data-side="b">+ B면 트랙 추가</button>
      </div>
    </div>
  `).join('');
}

function syncCdDiscs(){
  const n = setVal.cd;
  const discs = trackState.cd.discs;
  while(discs.length < n) discs.push(['']);
  while(discs.length > n) discs.pop();
  renderCdTracks();
}

function syncTapeSides(){
  const n = setVal.tape;
  const tapes = trackState.tape.tapes;
  while(tapes.length < n) tapes.push({ a:[''], b:[''] });
  while(tapes.length > n) tapes.pop();
  renderTapeTracks();
}

function initCdTrackBuilder(){
  renderCdTracks();
  const wrap = document.getElementById('tracks-cd');
  wrap.addEventListener('input', e=>{
    if(e.target.matches('input[data-idx]')){
      const disc = Number(e.target.dataset.disc);
      const idx = Number(e.target.dataset.idx);
      trackState.cd.discs[disc][idx] = e.target.value;
    }
  });
  wrap.addEventListener('click', e=>{
    if(e.target.matches('.track-remove')){
      const disc = Number(e.target.dataset.disc);
      const idx = Number(e.target.dataset.idx);
      const arr = trackState.cd.discs[disc];
      if(arr.length > 1) arr.splice(idx, 1); else arr[0] = '';
      renderCdTracks();
    }else if(e.target.matches('.add-track-sub')){
      const disc = Number(e.target.dataset.disc);
      trackState.cd.discs[disc].push('');
      renderCdTracks();
      const inputs = wrap.querySelectorAll(`input[data-disc="${disc}"]`);
      inputs[inputs.length-1].focus();
    }
  });
}

function initTapeTrackBuilder(){
  renderTapeTracks();
  const wrap = document.getElementById('tracks-tape');
  wrap.addEventListener('input', e=>{
    if(e.target.matches('input[data-idx]')){
      const t = Number(e.target.dataset.tape);
      const side = e.target.dataset.side;
      const idx = Number(e.target.dataset.idx);
      trackState.tape.tapes[t][side][idx] = e.target.value;
    }
  });
  wrap.addEventListener('click', e=>{
    if(e.target.matches('.track-remove')){
      const t = Number(e.target.dataset.tape);
      const side = e.target.dataset.side;
      const idx = Number(e.target.dataset.idx);
      const arr = trackState.tape.tapes[t][side];
      if(arr.length > 1) arr.splice(idx, 1); else arr[0] = '';
      renderTapeTracks();
    }else if(e.target.matches('.add-track-sub')){
      const t = Number(e.target.dataset.tape);
      const side = e.target.dataset.side;
      trackState.tape.tapes[t][side].push('');
      renderTapeTracks();
      const inputs = wrap.querySelectorAll(`input[data-tape="${t}"][data-side="${side}"]`);
      inputs[inputs.length-1].focus();
    }
  });
}

function resetCdTrackBuilder(){
  trackState.cd.discs = [ [''] ];
  renderCdTracks();
}
function resetTapeTrackBuilder(){
  trackState.tape.tapes = [ { a:[''], b:[''] } ];
  renderTapeTracks();
}

function collectCdTracks(){
  const out = [];
  const multi = trackState.cd.discs.length > 1;
  trackState.cd.discs.forEach((discTracks, dIdx)=>{
    discTracks.map(s=>s.trim()).filter(Boolean).forEach(name=>{
      out.push(multi ? `Disc ${dIdx+1}: ${name}` : name);
    });
  });
  return out;
}

function collectTapeTracks(){
  const out = [];
  const multi = trackState.tape.tapes.length > 1;
  trackState.tape.tapes.forEach((t, tIdx)=>{
    const prefix = multi ? `Tape ${tIdx+1} ` : '';
    t.a.map(s=>s.trim()).filter(Boolean).forEach(name=> out.push(`${prefix}A면: ${name}`));
    t.b.map(s=>s.trim()).filter(Boolean).forEach(name=> out.push(`${prefix}B면: ${name}`));
  });
  return out;
}

// ---- 엑셀 열 정의 (내보내기/폼/업로드 공용) ----
const COLS_CD = ['아티스트','제목','CD Number','트랙','메모'];
const COLS_TAPE = ['아티스트','제목','side','트랙','메모'];
const COLS_BOOK = ['저자명','제목','출판사','구매처','구매일','메모'];
const COLS_CUSTOM = ['물품명','구매/선물','날짜','메모'];

function safeSheetName(name){
  // 엑셀 시트명 제약: 31자 이내, \ / ? * [ ] : 금지
  let s = String(name).replace(/[\\/?*\[\]:]/g, '_').trim();
  if(!s) s = 'Sheet';
  return s.slice(0, 31);
}

function parseCdTrackString(s){
  const m = String(s).match(/^Disc\s+(\d+):\s*(.*)$/i);
  if(m) return { discNum: parseInt(m[1],10), name: m[2] };
  return { discNum: 1, name: String(s) };
}

function parseTapeTrackString(s){
  const stripped = String(s).replace(/^Tape\s+\d+\s+/i, '');
  const m = stripped.match(/^(A|B)면:\s*(.*)$/i);
  if(m) return { side: m[1].toUpperCase(), name: m[2] };
  return { side: 'A', name: stripped };
}

// ---- 엑셀 내보내기 (트랙 1개 = 1행) ----
function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    statusMsg('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.');
    return;
  }
  const wb = XLSX.utils.book_new();

  const cdRows = [];
  data.cd.forEach(item => {
    const tracks = item.tracks || [];
    if(!tracks.length){
      cdRows.push({ '제목': item.title, '아티스트': item.artist||'', 'CD Number': item.setCount||1, '트랙': '', '메모': item.note||'' });
    }else{
      const dn = item.discNotes || {};
      const hasDn = Object.keys(dn).length > 0;
      const seen = new Set();
      tracks.forEach(t=>{
        const { discNum, name } = parseCdTrackString(t);
        let memo = item.note || '';
        if(hasDn){
          memo = '';
          if(!seen.has(discNum)){
            seen.add(discNum);
            memo = dn[discNum] || '';
            // 디스크 메모와 앨범 메모가 둘 다 있으면 첫 디스크에 함께 적어 내용이 사라지지 않게 함
            if(item.note && seen.size === 1) memo = memo ? memo + ' / ' + item.note : item.note;
          }
        }
        cdRows.push({ '제목': item.title, '아티스트': item.artist||'', 'CD Number': discNum, '트랙': name, '메모': memo });
      });
    }
  });

  const tapeRows = [];
  data.tape.forEach(item => {
    const tracks = item.tracks || [];
    if(!tracks.length){
      tapeRows.push({ '제목': item.title, '아티스트': item.artist||'', 'side': '', '트랙': '', '메모': item.note||'' });
    }else{
      tracks.forEach(t=>{
        const { side, name } = parseTapeTrackString(t);
        tapeRows.push({ '제목': item.title, '아티스트': item.artist||'', 'side': side, '트랙': name, '메모': item.note||'' });
      });
    }
  });

  const bookRows = data.book.map(item => ({
    '제목': item.title,
    '저자명': item.author || '',
    '출판사': item.publisher || '',
    '구매처': item.place || '',
    '구매일': item.purchaseDate || '',
    '메모': item.note || ''
  }));

  const sheetCd = XLSX.utils.json_to_sheet(cdRows.length ? cdRows : [], { header: COLS_CD });
  const sheetTape = XLSX.utils.json_to_sheet(tapeRows.length ? tapeRows : [], { header: COLS_TAPE });
  const sheetBook = XLSX.utils.json_to_sheet(bookRows.length ? bookRows : [], { header: COLS_BOOK });

  XLSX.utils.book_append_sheet(wb, sheetCd, 'CD');
  XLSX.utils.book_append_sheet(wb, sheetTape, '테이프');
  XLSX.utils.book_append_sheet(wb, sheetBook, '도서');

  customTabs.forEach(tab=>{
    const rows = (data[tab.id]||[]).map(item => ({
      '물품명': item.title,
      '구매/선물': item.isGift ? '선물' : '구매',
      '날짜': item.date || '',
      '메모': item.note || ''
    }));
    const sheet = XLSX.utils.json_to_sheet(rows.length ? rows : [], { header: COLS_CUSTOM });
    XLSX.utils.book_append_sheet(wb, sheet, safeSheetName(tab.name));
  });

  const today = new Date().toISOString().slice(0,10);
  const namePart = ownerName ? sanitizeFileName(ownerName) : '나의';
  XLSX.writeFile(wb, `${namePart}_온라인캐비넷_${today}.xlsx`);
  statusMsg('엑셀 파일로 내보냈습니다.');
}

function sanitizeFileName(s){
  return s.replace(/[\\/:*?"<>|]/g, '').trim() || '나의';
}

function normalizeDateCell(v){
  if(v === undefined || v === null || v === '') return '';
  if(typeof v === 'number'){
    // 엑셀 날짜 일련번호 → YYYY-MM-DD
    const ms = Math.round((v - 25569) * 86400 * 1000);
    const d = new Date(ms);
    if(!isNaN(d)) return d.toISOString().slice(0,10);
  }
  return String(v).trim();
}

function isMultiDiscItem(item){

    || Object.keys(item.discNotes || {}).length > 0

// 수정 창용 글: 'Disc1 · 메모' 줄 아래에 'Disc1-1 곡명' 줄들 (디스크마다 번호가 1부터)
function buildDiscEditText(item){
  const dn = item.discNotes || {};
  const byDisc = new Map();
  (item.tracks || []).forEach(t=>{
    const m = String(t).match(/^Disc\s+(\d+):\s*(.*)$/i);
    const d = m ? parseInt(m[1], 10) : 1;
    if(!byDisc.has(d)) byDisc.set(d, []);
    byDisc.get(d).push(m ? m[2] : String(t));
  });
  const maxD = Math.max(item.setCount || 1, ...byDisc.keys(), ...Object.keys(dn).map(Number));
  const lines = [];
  for(let d = 1; d <= maxD; d++){
    lines.push(`Disc${d}${dn[d] ? ' · ' + dn[d] : ''}`);
    (byDisc.get(d) || []).forEach((name, i)=> lines.push(`Disc${d}-${i + 1} ${name}`));
  }
  return lines.join('\n');
}

// 위 형식의 글을 다시 저장용 데이터로 (번호는 줄 순서대로 새로 매겨짐)
function parseDiscEditText(text){
  const tracks = [], notes = {};
  let cur = 1, maxN = 1;
  text.split('\n').forEach(raw=>{
    const line = raw.trim();
    if(!line) return;
    let m;
    if((m = line.match(/^Disc\s*(\d+)\s*-\s*(\d+)(?:\s+(.*))?$/i))){
      cur = parseInt(m[1], 10); maxN = Math.max(maxN, cur);
      const name = (m[3] || '').trim();
      if(name) tracks.push(`Disc ${cur}: ${name}`);
    }else if((m = line.match(/^Disc\s*(\d+)\s*(?:·\s*(.*))?$/i))){
      cur = parseInt(m[1], 10); maxN = Math.max(maxN, cur);
      if(m[2] && m[2].trim()) notes[String(cur)] = m[2].trim();
    }else if((m = line.match(/^Disc\s*(\d+)\s*[:：]\s*(.*)$/i))){
      cur = parseInt(m[1], 10); maxN = Math.max(maxN, cur);
      if(m[2].trim()) tracks.push(`Disc ${cur}: ${m[2].trim()}`);
    }else{
      tracks.push(`Disc ${cur}: ${line}`);   // 번호 없이 적은 줄은 바로 윗 디스크의 곡으로 처리
    }
  });
  return { tracks, notes, maxN };
}

async function saveEdit(){
  if(!editing) return;
  const { k, id } = editing;
  const idx = (data[k] || []).findIndex(x => x.id === id);
  if(idx < 0){ closeEditModal(); return; }
  const old = data[k][idx];
  const r = editRefs;
  const v = (key)=> normStr(r[key].value);

  const title = v('title');
  if(!title){
    showEditError('제목을 입력해주세요.');
    r.title.focus();
    return;
  }

  let updated;
  if(k === 'cd' || k === 'tape'){
    let tracks, maxN = 0, parsedNotes = null;
    if(k === 'cd' && editDiscMode){
      const pr = parseDiscEditText(r.tracks.value);
      tracks = pr.tracks; maxN = pr.maxN; parsedNotes = pr.notes;
    }else{
      tracks = r.tracks.value.split('\n').map(t => t.trim()).filter(Boolean);
      // 트랙에 적힌 Disc/Tape 번호보다 구성 수를 작게 줄이지는 않음
      tracks.forEach(t=>{
        const m = (k === 'cd') ? t.match(/^Disc\s+(\d+):/i) : t.match(/^Tape\s+(\d+)\s/i);
        if(m) maxN = Math.max(maxN, parseInt(m[1], 10));
      });
    }
    let cnt = parseInt(r.count.value, 10);
    if(!cnt || cnt < 1) cnt = 1;
    if(cnt > 50) cnt = 50;
    cnt = Math.max(cnt, maxN);
    updated = Object.assign({}, old, { title, artist: v('artist'), setCount: cnt, tracks, note: v('note') });
    if(k === 'cd' && editDiscMode){
      if(parsedNotes && Object.keys(parsedNotes).length) updated.discNotes = parsedNotes; else delete updated.discNotes;
    }
  }else if(k === 'book'){
    updated = Object.assign({}, old, {
      title, author: v('author'), publisher: v('publisher'), place: v('place'),
      purchaseDate: v('purchaseDate'), note: v('note')
    });
  }else{
    updated = Object.assign({}, old, { title, isGift: r.isGift.checked, date: v('date'), note: v('note') });
  }

  data[k][idx] = updated;
  closeEditModal();
  await save(k);
  renderList(k);
  updateTotal();
  const q = document.getElementById('searchInput').value;
  if(q.trim()) runSearch(q);
  statusMsg('수정되었습니다.');
}

// ---- 완전히 같은 항목 비교 / 중복 확인 창 ----
function normStr(v){ return String(v == null ? '' : v).trim(); }

function discNotesKey(o){
  return JSON.stringify(Object.keys(o || {}).sort((x, y)=> x - y).map(n => [n, normStr(o[n])]));
}

function sameContent(k, a, b){
  const f = (x, name) => normStr(x[name]);
  if(k === 'cd' || k === 'tape'){
    return f(a,'title') === f(b,'title') && f(a,'artist') === f(b,'artist')
      && (Number(a.setCount) || 1) === (Number(b.setCount) || 1)
      && (a.tracks || []).map(normStr).join('\u0001') === (b.tracks || []).map(normStr).join('\u0001')
      && f(a,'note') === f(b,'note')
      && discNotesKey(a.discNotes) === discNotesKey(b.discNotes);
  }
  if(k === 'book'){
    return ['title','author','publisher','place','purchaseDate','note'].every(n => f(a,n) === f(b,n));
  }
  // 사용자 정의 탭
  return f(a,'title') === f(b,'title') && !!a.isGift === !!b.isGift
    && f(a,'date') === f(b,'date') && f(a,'note') === f(b,'note');
}

function askDuplicateChoice(dups){
  return new Promise(resolve=>{

    const body = document.getElementById('dupModalBody');
    body.textContent = '';

    intro.textContent = `엑셀 안에 현재 목록과 내용이 완전히 같은 항목이 ${dups.length}건 있어요.`;

    help.textContent = '덮어쓰기: 기존 항목을 교체해서 중복 없이 한 개만 남아요. / 중복으로 추가: 같은 항목이 하나 더 생겨요. (같지 않은 항목은 어느 쪽을 골라도 그대로 추가돼요.)';

function importFromExcel(file){
  if(typeof XLSX === 'undefined'){
    statusMsg('엑셀 라이브러리를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.');
    return;
  }
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let wb;
    try{
      wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:false });
    }catch(err){
      statusMsg('엑셀 파일을 읽는 중 오류가 발생했습니다.');
      return;
    }

    // 파싱한 항목을 먼저 모아두고, 기존 목록과 비교한 뒤에 반영해요
    const staged = {};
    const stage = (k, item)=>{ (staged[k] = staged[k] || []).push(item); };

    // ---- CD: 행 단위 트랙 → 제목+아티스트 기준으로 그룹핑, CD Number별로 트랙 묶기 ----
    const cdSheet = wb.Sheets['CD'];
    if(cdSheet){
      const rows = XLSX.utils.sheet_to_json(cdSheet, { defval:'' });
      const groups = new Map(); // key -> { title, artist, note, discs: Map(discNum -> [track,...]) }
      let prevTitle = '', prevArtist = '';
      rows.forEach(row=>{
        let title = String(row['제목']||'').trim();
        let artist = String(row['아티스트']||'').trim();
        const note = String(row['메모']||'').trim();
        const trackName = String(row['트랙']||'').trim();
        // 제목이 빈칸이면 바로 윗줄의 앨범에 속한 곡으로 간주 (제목·아티스트를 첫 줄에만 적어도 됨)
        if(!title){
          if(!prevTitle || !(trackName || note || artist)) return;
          title = prevTitle;
          if(!artist) artist = prevArtist;
        }else if(!artist){
          // 제목이 바뀌어도 아티스트가 빈칸이면 윗줄 아티스트를 계속 이어받음
          artist = prevArtist;
        }
        prevTitle = title; prevArtist = artist;
        const key = groupKey(title, artist);
        if(!groups.has(key)){
          groups.set(key, { title, artist, note, discs: new Map(), lastDisc: 1, discNotes: new Map() });
        }
        const g = groups.get(key);

        // CD Number가 빈칸이면 같은 앨범의 바로 윗줄 값을 이어받음 (새 앨범은 1부터 시작)
        let discNum = parseInt(row['CD Number'], 10);
        if(!discNum || discNum < 1) discNum = g.lastDisc;
        g.lastDisc = discNum;

        if(!g.note && note) g.note = note;
        // 메모도 CD Number를 따라감: 그 디스크의 첫 메모가 그 디스크 이름이 됨 (빈칸은 같은 디스크 안에서 윗줄을 이어받는 효과)
        if(note && !g.discNotes.has(discNum)) g.discNotes.set(discNum, note);
        if(trackName){
          if(!g.discs.has(discNum)) g.discs.set(discNum, []);
          g.discs.get(discNum).push(trackName);
        }else if(!g.discs.has(discNum)){
          g.discs.set(discNum, []);
        }
      });

      groups.forEach(g=>{
        const discNums = Array.from(g.discs.keys()).sort((a,b)=>a-b);
        const maxDisc = discNums.length ? Math.max(...discNums) : 1;
        const multi = maxDisc > 1;
        const tracks = [];
        discNums.forEach(dn=>{
          g.discs.get(dn).forEach(name=>{
            tracks.push(multi ? `Disc ${dn}: ${name}` : name);
          });
        });
        stage('cd', {
          id: 'cd_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
          title: g.title,
          artist: g.artist,
          setCount: maxDisc,
          tracks,
          note: (maxDisc > 1 && g.discNotes.size) ? '' : g.note,
          discNotes: (maxDisc > 1 && g.discNotes.size) ? Object.fromEntries(g.discNotes) : undefined
        });
      });
    }

    // ---- 테이프: 행 단위 트랙 → 제목+아티스트 기준으로 그룹핑, side(A/B)별로 트랙 묶기 ----
    const tapeSheet = wb.Sheets['테이프'];
    if(tapeSheet){
      const rows = XLSX.utils.sheet_to_json(tapeSheet, { defval:'' });
      const groups = new Map(); // key -> { title, artist, note, a:[...], b:[...] }
      let prevTitle = '', prevArtist = '';
      rows.forEach(row=>{
        let title = String(row['제목']||'').trim();
        let artist = String(row['아티스트']||'').trim();
        const note = String(row['메모']||'').trim();
        const trackName = String(row['트랙']||'').trim();
        // 제목이 빈칸이면 바로 윗줄의 테이프에 속한 곡으로 간주
        if(!title){
          if(!prevTitle || !(trackName || note || artist)) return;
          title = prevTitle;
          if(!artist) artist = prevArtist;
        }else if(!artist){
          // 제목이 바뀌어도 아티스트가 빈칸이면 윗줄 아티스트를 계속 이어받음
          artist = prevArtist;
        }
        prevTitle = title; prevArtist = artist;
        const sideRaw = String(row['side']||'').trim().toUpperCase();

        const key = groupKey(title, artist);
        if(!groups.has(key)){
          groups.set(key, { title, artist, note, a: [], b: [], lastSide: 'A' });
        }
        const g = groups.get(key);

        // side가 빈칸이면 같은 테이프의 바로 윗줄 값을 이어받음 (새 테이프는 A면부터 시작)
        let side = g.lastSide;
        if(sideRaw) side = sideRaw.startsWith('B') ? 'B' : 'A';
        g.lastSide = side;

        if(!g.note && note) g.note = note;
        if(trackName) g[side.toLowerCase()].push(trackName);
      });

      groups.forEach(g=>{
        const tracks = [
          ...g.a.map(name=>`A면: ${name}`),
          ...g.b.map(name=>`B면: ${name}`)
        ];
        stage('tape', {
          id: 'tape_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
          title: g.title,
          artist: g.artist,
          setCount: 1,
          tracks,
          note: g.note
        });
      });
    }

    const bookSheet = wb.Sheets['도서'];
    if(bookSheet){
      const rows = XLSX.utils.sheet_to_json(bookSheet, { defval:'' });
      rows.forEach(row=>{
        const title = String(row['제목']||'').trim();
        if(!title) return;
        stage('book', {
          id: 'book_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
          title,
          author: String(row['저자명']||'').trim(),
          publisher: String(row['출판사']||'').trim(),
          place: String(row['구매처']||'').trim(),
          purchaseDate: normalizeDateCell(row['구매일']),
          note: String(row['메모']||'').trim()
        });
      });
    }

    // ---- 사용자 정의 탭: 탭 이름과 일치하는 시트를 찾아 가져오기 ----
    function importCustomRows(sheet, tabId){
      const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      let count = 0;
      rows.forEach(row=>{
        const title = String(row['물품명']||'').trim();
        if(!title) return;
        const typeRaw = String(row['구매/선물']||'').trim();
        stage(tabId, {
          id: 'item_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
          title,
          isGift: typeRaw.includes('선물'),
          date: normalizeDateCell(row['날짜']),
          note: String(row['메모']||'').trim()
        });
        count++;
      });
      return count;
    }

    customTabs.forEach(tab=>{
      const sheet = wb.Sheets[safeSheetName(tab.name)];
      if(!sheet) return;
      importCustomRows(sheet, tab.id);
    });

    // ---- 기존 탭에 없는 시트는 새 탭을 자동으로 만들어서 가져오기 ----
    const knownSheetNames = new Set(['CD','테이프','도서', ...customTabs.map(t=>safeSheetName(t.name))]);
    const newTabsCreated = [];
    for(const sheetName of wb.SheetNames){
      if(knownSheetNames.has(sheetName)) continue;
      const sheet = wb.Sheets[sheetName];
      const rows0 = XLSX.utils.sheet_to_json(sheet, { defval:'' });
      // '물품명' 또는 '구매/선물' 열이 있는 시트만 사용자 정의 탭 형식으로 인식
      const looksCustom = rows0.length === 0 || Object.prototype.hasOwnProperty.call(rows0[0]||{}, '물품명');
      if(!looksCustom) continue;

      const newTab = { id: slugify(sheetName), name: sheetName.trim() || sheetName };
      customTabs.push(newTab);
      buildCustomTabDom(newTab, false);
      importCustomRows(sheet, newTab.id);
      newTabsCreated.push(newTab);
    }
    // ---- 기존 목록과 내용이 완전히 같은 항목 찾기 ----
    const dups = []; // { k, item, existing }
    Object.keys(staged).forEach(k=>{
      const used = new Set();
      staged[k].forEach(item=>{
        const ex = (data[k] || []).find(e => !used.has(e.id) && sameContent(k, e, item));
        if(ex){ used.add(ex.id); dups.push({ k, item, existing: ex }); }
      });
    });

    let mode = 'add';
    if(dups.length){
      mode = await askDuplicateChoice(dups);
      if(mode === 'cancel'){
        // 이번 업로드로 새로 만들어진 탭이 있으면 되돌림
        newTabsCreated.forEach(t=>{
          customTabs = customTabs.filter(x => x.id !== t.id);
          delete data[t.id];
          const btn = document.querySelector(`button[data-k="${t.id}"]`); if(btn) btn.remove();
          const panel = document.querySelector(`.panel[data-k="${t.id}"]`); if(panel) panel.remove();
        });
        statusMsg('업로드를 취소했어요. 목록은 그대로예요.');
        return;
      }
    }

    const dupByItem = new Map(dups.map(d => [d.item, d]));
    const touched = new Set();
    Object.keys(staged).forEach(k=>{
      if(!data[k]) data[k] = [];
      staged[k].forEach(item=>{
        const d = dupByItem.get(item);
        if(d && mode === 'overwrite'){
          // 기존 항목을 같은 자리에서 교체 (id와 첨부 사진은 유지)
          const idx = data[k].indexOf(d.existing);
          const merged = Object.assign({}, item, { id: d.existing.id });
          if(d.existing.image) merged.image = d.existing.image;
          data[k][idx] = merged;
        }else{
          data[k].unshift(item);
        }
        touched.add(k);
      });
    });

    if(newTabsCreated.length) await saveCustomTabsList();
    for(const k of touched) await save(k);
    renderAll();
    const q = document.getElementById('searchInput').value;
    if(q.trim()) runSearch(q);

    const cnt = k => (staged[k] || []).length;
    const customPart = customTabs
      .filter(t => cnt(t.id))
      .map(t => `${t.name} ${cnt(t.id)}건${newTabsCreated.includes(t) ? ' (새 탭)' : ''}`)
      .join(', ');
    const total = Object.values(staged).reduce((a, arr) => a + arr.length, 0);
    const dupNote = !dups.length ? ''
      : (mode === 'overwrite' ? ` (같은 항목 ${dups.length}건은 덮어씀)` : ` (같은 항목 ${dups.length}건은 중복으로 추가됨)`);
    statusMsg(total
      ? `엑셀에서 CD ${cnt('cd')}건, 테이프 ${cnt('tape')}건, 도서 ${cnt('book')}건${customPart ? ', '+customPart : ''}을 불러왔습니다.${dupNote}`
      : '가져올 항목을 찾지 못했습니다. 시트 이름과 열 제목을 확인해주세요.');
  };
  reader.onerror = ()=> statusMsg('파일을 읽는 중 오류가 발생했습니다.');
  reader.readAsArrayBuffer(file);
}

const MAX_IMAGE_ITEMS = 5;
let pendingRecordImage = null; // 압축된 base64 데이터

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h){
          if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        }else{
          if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function countAllImages(){
  let n = 0;
  ['cd','tape','book'].forEach(k => n += (data[k]||[]).filter(it=>it.image).length);
  customTabs.forEach(t => n += (data[t.id]||[]).filter(it=>it.image).length);
  return n;
}

      targetId = existing.id;
    }else{
      const newTab = { id: slugify(name), name };
      customTabs.push(newTab);
      buildCustomTabDom(newTab, false);
      await saveCustomTabsList();
      targetId = newTab.id;
    }
  }else{
    targetId = catVal; // 'cd' | 'tape' | 'book'
  }

  const title = note || '(메모 없음)';
  let item;
  if(targetId === 'cd' || targetId === 'tape'){
    item = { id: targetId+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), title, artist: '', setCount: 1, tracks: [], note: '', image: pendingRecordImage };
  }else if(targetId === 'book'){
    item = { id: 'book_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), title, author: '', publisher: '', place: '', purchaseDate: '', note: '', image: pendingRecordImage };
  }else{
    item = { id: 'item_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), title, isGift: false, date: '', note: '', image: pendingRecordImage };
  }

  if(!data[targetId]) data[targetId] = [];
  data[targetId].unshift(item);
  await save(targetId);
  renderList(targetId);
  updateTotal();
  refreshImgRecUI();
  resetImgRecPreview();
  statusMsg(`"${kindLabelFor(targetId)}"에 저장되었습니다.`);
});

loadOwnerName();
loadDisplaySettings();
loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
